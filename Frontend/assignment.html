<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Страница задания по личной ссылке: не индексировать и не передавать адрес (в нём код) другим сайтам -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- Страница открывается по адресу /a/<код>: все относительные пути (css, js, i18n) считаем от корня сайта -->
  <base href="/">
  <title>&#8203;</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
</head>
<body class="student-page">
  <!-- Шапка: только логотип, язык и тема (никакой навигации учителя) -->
  <header class="student-header">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c.5 4.6 2.9 7 9.5 9.5-6.6 2.5-9 4.9-9.5 9.5-.5-4.6-2.9-7-9.5-9.5 6.6-2.5 9-4.9 9.5-9.5z"/></svg></span><span class="logo-text" data-i18n="app.logo"></span></div>
    <div class="auth-tools">
      <details class="menu lang-menu">
        <summary class="lang-btn" data-i18n-aria="lang.choose"><span class="lang-current">RU</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="menu-pop lang-pop">
          <!-- Названия языков на самих языках — как в переключателе на главной -->
          <button type="button" data-lang="ru" lang="ru" role="menuitemradio" aria-checked="false"><span class="lang-code">RU</span>Русский</button>
          <button type="button" data-lang="kk" lang="kk" role="menuitemradio" aria-checked="false"><span class="lang-code">KZ</span>Қазақша</button>
          <button type="button" data-lang="en" lang="en" role="menuitemradio" aria-checked="false"><span class="lang-code">EN</span>English</button>
        </div>
      </details>
      <button class="theme-toggle" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="loading" class="hint" data-i18n="common.loading" role="status"></div>

    <!-- Нет задания (неверная ссылка или учитель закрыл) или нет связи -->
    <section id="unavailable" class="card" hidden>
      <h1 id="unavailableTitle" class="student-title"></h1>
      <p class="hint" data-i18n="student.unavailableHint"></p>
    </section>

    <!-- Шаг 1: имя -->
    <section id="stepName" class="card" hidden>
      <div class="tool-head"><span id="typeTag" class="tool-tag"></span></div>
      <h1 id="assignmentTitle" class="student-title"></h1>
      <form id="nameForm" novalidate>
        <label for="studentName" data-i18n="student.nameLabel"></label>
        <input id="studentName" class="input" type="text" maxlength="40" autocomplete="off" autocapitalize="words"
               spellcheck="false" aria-describedby="nameHint privacyNote" data-i18n-placeholder="student.namePlaceholder" required>
        <div id="nameHint" class="hint" data-i18n="student.nameHint"></div>
        <div id="privacyNote" class="auth-message student-note" data-i18n="student.privacy"></div>
        <div id="nameError" class="auth-message" data-kind="error" role="alert"></div>
        <button class="primary" type="submit" data-i18n="student.start"></button>
      </form>
    </section>

    <!-- Шаг 2: само задание -->
    <section id="stepWork" hidden>
      <div id="youAre" class="hint student-you"></div>
      <div id="work"></div>
      <div id="sendStatus" class="auth-message" role="status"></div>
      <button id="retryBtn" type="button" class="btn-primary student-retry" data-i18n="student.retry" hidden></button>
    </section>

    <!-- Шаг 3: результат -->
    <section id="stepDone" class="card student-done" hidden>
      <div class="logo-mark student-done-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 class="student-title" data-i18n="student.doneTitle"></h1>
      <div id="resultLine" class="score"></div>
      <p class="hint" data-i18n="student.teacherSees"></p>
      <button id="againBtn" type="button" class="btn-soft" data-i18n="student.again"></button>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/render.js"></script>
  <script src="js/quiz-view.js"></script>
  <script src="js/flashcards-view.js"></script>
  <script src="js/study-view.js"></script>
  <script src="js/assignment.js"></script>
</body>
</html>
