<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Страница задания по личной ссылке: не индексировать и не передавать адрес (в нём код) другим сайтам -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <!-- Страница открывается по адресу /a/<код>: все относительные пути (css, js, i18n) считаем от корня сайта -->
  <base href="/">
  <title>&#8203;</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="js/i18n.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
</head>
<body class="student-page">
  <div class="visually-hidden" data-pomo-live role="status"></div>
  <!-- Шапка: только логотип, язык и тема (никакой навигации учителя) -->
  <header class="student-header">
    <div class="logo"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.5c.5 4.6 2.9 7 9.5 9.5-6.6 2.5-9 4.9-9.5 9.5-.5-4.6-2.9-7-9.5-9.5 6.6-2.5 9-4.9 9.5-9.5z"/></svg></span><span class="logo-text" data-i18n="app.logo"></span></div>
    <div class="auth-tools">
      <!-- Таймер Помодоро (js/pomodoro.js): время видно, когда таймер запущен или на паузе -->
      <button type="button" class="pomo-chip" data-pomo-open aria-haspopup="dialog" aria-controls="pomoDialog"><svg class="pomo-mini" viewBox="0 0 36 36" aria-hidden="true"><circle class="pomo-track" cx="18" cy="18" r="15"/><circle class="pomo-value" data-pomo-ring cx="18" cy="18" r="15" pathLength="100"/></svg><svg class="pomo-chip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg><span class="pomo-chip-time" data-pomo-time>25:00</span></button>
      <details class="menu lang-menu">
        <summary class="lang-btn" data-i18n-aria="lang.choose"><span class="lang-current">RU</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
        <div class="menu-pop lang-pop">
          <!-- Названия языков на самих языках — как в переключателе на главной -->
          <button type="button" data-lang="ru" lang="ru" role="menuitemradio" aria-checked="false"><span class="lang-code">RU</span>Русский</button>
          <button type="button" data-lang="kk" lang="kk" role="menuitemradio" aria-checked="false"><span class="lang-code">KZ</span>Қазақша</button>
          <button type="button" data-lang="en" lang="en" role="menuitemradio" aria-checked="false"><span class="lang-code">EN</span>English</button>
        </div>
      </details>
      <button class="theme-toggle" type="button">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <div id="loading" class="hint" data-i18n="common.loading" role="status"></div>

    <!-- Нет задания (неверная ссылка или учитель закрыл) или нет связи -->
    <section id="unavailable" class="card" hidden>
      <h1 id="unavailableTitle" class="student-title"></h1>
      <p class="hint" data-i18n="student.unavailableHint"></p>
    </section>

    <!-- Шаг 1: имя -->
    <section id="stepName" class="card" hidden>
      <div class="tool-head"><span id="typeTag" class="tool-tag"></span></div>
      <h1 id="assignmentTitle" class="student-title"></h1>
      <form id="nameForm" novalidate>
        <label for="studentName" data-i18n="student.nameLabel"></label>
        <input id="studentName" class="input" type="text" maxlength="40" autocomplete="off" autocapitalize="words"
               spellcheck="false" aria-describedby="nameHint privacyNote" data-i18n-placeholder="student.namePlaceholder" required>
        <div id="nameHint" class="hint" data-i18n="student.nameHint"></div>
        <div id="privacyNote" class="auth-message student-note" data-i18n="student.privacy"></div>
        <div id="nameError" class="auth-message" data-kind="error" role="alert"></div>
        <button class="primary" type="submit" data-i18n="student.start"></button>
      </form>
    </section>

    <!-- Шаг 2: само задание -->
    <section id="stepWork" hidden>
      <div id="youAre" class="hint student-you"></div>
      <div id="work"></div>
      <div id="sendStatus" class="auth-message" role="status"></div>
      <button id="retryBtn" type="button" class="btn-primary student-retry" data-i18n="student.retry" hidden></button>
    </section>

    <!-- Шаг 3: результат -->
    <section id="stepDone" class="card student-done" hidden>
      <div class="logo-mark student-done-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1 class="student-title" data-i18n="student.doneTitle"></h1>
      <div id="resultLine" class="score"></div>
      <p class="hint" data-i18n="student.teacherSees"></p>
      <button id="againBtn" type="button" class="btn-soft" data-i18n="student.again"></button>
    </section>
  </main>

  <!-- Таймер Помодоро (js/pomodoro.js). Режима фокуса здесь нет: на странице ученика и так нет навигации -->
  <dialog id="pomoDialog" class="sheet pomo-sheet" aria-labelledby="pomoTitle">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-head">
      <h2 id="pomoTitle" data-i18n="pomo.title">Таймер</h2>
      <button type="button" class="icon-btn" data-close aria-label="Закрыть" data-i18n-aria="common.close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="pomo-main">
      <div class="pomo-ring-wrap">
        <svg class="pomo-ring" viewBox="0 0 120 120" aria-hidden="true"><circle class="pomo-track" cx="60" cy="60" r="54"/><circle class="pomo-value" data-pomo-ring cx="60" cy="60" r="54" pathLength="100"/></svg>
        <div class="pomo-ring-text">
          <span class="pomo-mode" data-pomo-mode></span>
          <span class="pomo-time" data-pomo-time role="timer" aria-live="off">25:00</span>
          <span class="pomo-round" data-pomo-round></span>
        </div>
      </div>
      <div class="pomo-count" data-pomo-count></div>
      <p class="hint pomo-note" data-pomo-note hidden></p>
    </div>
    <div class="pomo-controls">
      <button type="button" class="btn-primary pomo-toggle" data-pomo-action="toggle"><svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M8 5.5v13a1 1 0 0 0 1.5.9l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5z"/></svg><svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg><span class="pomo-toggle-text"></span></button>
      <button type="button" class="btn-soft" data-pomo-action="reset" data-i18n="pomo.reset"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 3.5v5h5"/></svg>Сбросить</button>
      <button type="button" class="btn-soft" data-pomo-action="skip" data-i18n="pomo.skip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 5.5l9.5 6.5L5 18.5z"/><path d="M19 5v14"/></svg>Пропустить</button>
    </div>
    <details class="pomo-settings-box">
      <summary data-i18n="pomo.settings">Настройки</summary>
      <form id="pomoSettings" novalidate>
        <div class="pomo-fields">
          <div><label for="pomoWork" data-i18n="pomo.field.work">Работа</label><input id="pomoWork" name="work" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="pomoRangeHint"></div>
          <div><label for="pomoShort" data-i18n="pomo.field.short">Короткий перерыв</label><input id="pomoShort" name="short" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="pomoRangeHint"></div>
          <div><label for="pomoLong" data-i18n="pomo.field.long">Длинный перерыв</label><input id="pomoLong" name="long" type="number" min="1" max="120" step="1" inputmode="numeric" aria-describedby="pomoRangeHint"></div>
        </div>
        <div id="pomoRangeHint" class="hint" data-i18n="pomo.range"></div>
        <label class="check"><input type="checkbox" name="autoStart"><span data-i18n="pomo.autoStart"></span></label>
        <label class="check"><input type="checkbox" name="sound"><span data-i18n="pomo.sound"></span></label>
        <label class="check"><input type="checkbox" name="notify" aria-describedby="pomoNotifyHint"><span data-i18n="pomo.notify"></span></label>
        <div id="pomoNotifyHint" class="hint" hidden></div>
      </form>
    </details>
    <div class="visually-hidden" data-pomo-live role="status"></div>
  </dialog>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/render.js"></script>
  <script src="js/quiz-view.js"></script>
  <script src="js/flashcards-view.js"></script>
  <script src="js/study-view.js"></script>
  <script src="js/assignment.js"></script>
  <script src="js/pomodoro.js"></script>
</body>
</html>
